<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة الطلبات</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; padding: 10px 10px 85px 10px; color: #f8fafc; direction: rtl; }

        .top-bar { background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .net-tag { font-size: 12px; font-weight: bold; color: #34d399; }
        .btn-refresh { background: #0284c7; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #334155; }
        .stat-card.sales { background: #075985; border-color: #38bdf8; }
        .stat-card.cash { background: #065f46; border-color: #34d399; }
        .stat-title { font-size: 11px; color: #e2e8f0; margin-bottom: 4px; font-weight: bold; }
        .stat-val { font-size: 16px; font-weight: 900; color: #fff; }
        .stat-sub { font-size: 10px; opacity: 0.85; margin-top: 2px; }

        .search-input { width: 100%; padding: 11px 14px; border: 2px solid #38bdf8; border-radius: 8px; font-size: 14px; background: #1e293b; color: #fff; margin-bottom: 10px; outline: none; }

        .order-card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; border-right: 6px solid #38bdf8; }
        .order-card.delivered { border-right-color: #10b981; }
        .order-card.postponed { border-right-color: #a855f7; }
        .order-card.returned { border-right-color: #ef4444; opacity: 0.8; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .cust-name { font-size: 16px; font-weight: bold; color: #fff; }
        .order-date { font-size: 11px; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }

        .status-pill { display: inline-block; font-size: 12px; font-weight: 900; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; text-align: center; }
        .status-pill.shipping { background: #082f49; color: #38bdf8; border: 1px solid #0284c7; }
        .status-pill.done { background: #064e3b; color: #34d399; border: 1px solid #059669; }
        .status-pill.post { background: #3b0764; color: #d8b4fe; border: 1px solid #9333ea; }
        .status-pill.ret { background: #450a0a; color: #f87171; border: 1px solid #dc2626; }

        .card-body { font-size: 13px; color: #cbd5e1; line-height: 1.7; margin-bottom: 8px; }
        .price-highlight { color: #38bdf8; font-size: 15px; font-weight: 900; }

        .gallery { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 4px; }
        .gallery img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; flex-shrink: 0; cursor: pointer; }

        .note-box { background: #0f172a; border: 1px dashed #f59e0b; padding: 6px 8px; border-radius: 6px; font-size: 11px; color: #fde047; margin-bottom: 6px; }

        .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
        .btn-row button, .btn-row a { border: 0; padding: 7px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-call { background: #22c55e; color: #fff; }
        .btn-wa { background: #0284c7; color: #fff; }
        .btn-done { background: #059669; color: #fff; }
        .btn-post { background: #9333ea; color: #fff; }
        .btn-ret { background: #dc2626; color: #fff; }
        .btn-edit { background: #f59e0b; color: #1e293b; margin-right: auto; }

        .fab { position: fixed; bottom: 18px; left: 18px; background: #2563eb; color: #fff; border: 0; border-radius: 50px; padding: 14px 22px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(37,99,235,0.5); cursor: pointer; z-index: 999; }

        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 12px; }
        .modal-box { background: #1e293b; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #38bdf8; text-align: center; }
        input[type="text"], input[type="tel"], input[type="number"], textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #475569; border-radius: 8px; font-size: 14px; background: #0f172a; color: #fff; }
        textarea { height: 50px; }

        .check-box { display: flex; align-items: center; gap: 8px; background: #0f172a; border: 1px solid #475569; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .check-box input { width: 18px; height: 18px; }
        .check-box span { font-size: 13px; font-weight: bold; color: #38bdf8; }

        .calc-bar { background: #0f172a; border: 1px solid #38bdf8; padding: 8px; border-radius: 6px; font-size: 12px; color: #38bdf8; text-align: center; font-weight: bold; margin-bottom: 8px; }
        .upload-btn { display: block; background: #334155; padding: 9px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px dashed #38bdf8; margin-bottom: 8px; color: #38bdf8; }
        .previews { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
        .thumb-box { position: relative; flex-shrink: 0; }
        .thumb-box img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .thumb-del { position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; border: 0; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }

        .btn-action-main { background: #2563eb; color: #fff; border: 0; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-cancel { background: #475569; color: #fff; border: 0; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 6px; cursor: pointer; }
        .img-viewer img { max-width: 95%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="net-tag" id="netStatus">🟢 جاري التحميل...</span>
        <button class="btn-refresh" onclick="fetchOrders()">🔄 استرجاع البيانات</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card sales">
            <div class="stat-title">📊 إجمالي المبيعات (قطع)</div>
            <div class="stat-val" id="totalSales">0 د.ع</div>
            <div class="stat-sub" id="totalCount">0 طلب</div>
        </div>
        <div class="stat-card cash">
            <div class="stat-title">💰 الكاش الواصل المستلم</div>
            <div class="stat-val" id="totalCash">0 د.ع</div>
            <div class="stat-sub" id="deliveredCount">0 واصل</div>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث بالاسم، الرقم، أو العنوان..." oninput="renderUI()">

    <div id="ordersList"></div>

    <button class="fab" onclick="openAddModal()">➕ طلب جديد</button>

    <!-- نافذة إضافة طلب -->
    <div id="addModal" class="modal">
        <div class="modal-box">
            <div class="modal-title">📦 إضافة طلب جديد</div>
            <input type="text" id="cName" placeholder="اسم الزبون (مطلوب)">
            <input type="tel" id="cPhone" placeholder="رقم الهاتف">
            <input type="text" id="cAddr" placeholder="العنوان بالتفصيل">
            <input type="number" id="cPrice" placeholder="سعر القطع (دينار)" oninput="recalcAdd()">
            
            <label class="check-box">
                <input type="checkbox" id="cProvince" onchange="recalcAdd()">
                <span>شحن للمحافظات (+5,000 د.ع)</span>
            </label>

            <div id="calcView" class="calc-bar">المجموع عند الزبون: 0 د.ع</div>
            <textarea id="cNotes" placeholder="ملاحظات الطلب (اختياري)"></textarea>

            <label class="upload-btn" for="fileInput">📷 اختيار صور المنتجات</label>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="processImages(event, 'new')">
            <div id="addPreviews" class="previews"></div>

            <button type="button" class="btn-action-main" onclick="createOrder()">تثبيت الطلب</button>
            <button class="btn-cancel" onclick="closeAddModal()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة التعديل -->
    <div id="editModal" class="modal">
        <div class="modal-box">
            <div class="modal-title">✏️ تعديل الطلب</div>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="اسم الزبون">
            <input type="tel" id="editPhone" placeholder="رقم الهاتف">
            <input type="text" id="editAddr" placeholder="العنوان">
            <input type="number" id="editPrice" placeholder="سعر القطع">
            
            <label class="check-box">
                <input type="checkbox" id="editProvince">
                <span>شحن للمحافظات (+5,000 د.ع)</span>
            </label>

            <textarea id="editNotes" placeholder="ملاحظات"></textarea>

            <div id="editPreviews" class="previews"></div>
            <label class="upload-btn" for="editFileInput">📷 إضافة صور أخرى</label>
            <input type="file" id="editFileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event, 'edit')">

            <button class="btn-action-main" style="background:#059669;" onclick="saveEdit()">💾 حفظ التعديلات</button>
            <button class="btn-cancel" onclick="closeEditModal()">إلغاء</button>
        </div>
    </div>

    <div id="viewerModal" class="modal img-viewer" onclick="this.style.display='none'">
        <img id="viewerImg" src="">
    </div>

    <script>
        const FIREBASE_URL = "https://orders-99674-default-rtdb.firebaseio.com/orders.json";
        const LOCAL_KEY = "orders_master_store";

        let orders = [];
        let newImages = [];
        let editImages = [];

        // محاولة استرجاع البيانات المخزنة مسبقاً من المتصفح
        function getStoredData() {
            const keys = [
                LOCAL_KEY,
                "orders_days_system_v2",
                "orders_days_system_v1",
                "orders_v9_light_cache",
                "orders_v8_stable",
                "orders_v7_delivery_system",
                "orders_v5_master"
            ];
            for (let k of keys) {
                try {
                    const raw = localStorage.getItem(k);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch(e) {}
            }
            return [];
        }

        orders = getStoredData();

        function saveLocal() {
            try {
                localStorage.setItem(LOCAL_KEY, JSON.stringify(orders));
            } catch(e) {}
        }

        function recalcAdd() {
            const p = parseFloat(document.getElementById("cPrice").value) || 0;
            const fee = document.getElementById("cProvince").checked ? 5000 : 0;
            document.getElementById("calcView").innerText = `المجموع عند الزبون: ${(p + fee).toLocaleString()} د.ع ${fee > 0 ? '(شحن 5,000 د.ع)' : '(بدون شحن)'}`;
        }

        function formatDateTime(ts) {
            const d = new Date(ts || Date.now());
            let hours = d.getHours();
            const min = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12 || 12;
            return `${hours}:${min} ${ampm} (${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')})`;
        }

        function processImages(e, type) {
            const files = Array.from(e.target.files);
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const cvs = document.createElement("canvas");
                        let w = img.width, h = img.height;
                        const max = 220;
                        if (w > h && w > max) { h *= max / w; w = max; }
                        else if (h > max) { w *= max / h; h = max; }
                        cvs.width = w; cvs.height = h;
                        cvs.getContext("2d").drawImage(img, 0, 0, w, h);
                        const b64 = cvs.toDataURL("image/jpeg", 0.4);

                        if (type === 'new') {
                            newImages.push(b64);
                            renderThumbs('addPreviews', newImages, 'new');
                        } else {
                            editImages.push(b64);
                            renderThumbs('editPreviews', editImages, 'edit');
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(f);
            });
        }

        function renderThumbs(elemId, arr, type) {
            const el = document.getElementById(elemId);
            el.innerHTML = "";
            arr.forEach((src, i) => {
                el.innerHTML += `
                    <div class="thumb-box">
                        <img src="${src}">
                        <button type="button" class="thumb-del" onclick="removeThumb('${type}', ${i})">✕</button>
                    </div>
                `;
            });
        }

        function removeThumb(type, i) {
            if (type === 'new') {
                newImages.splice(i, 1);
                renderThumbs('addPreviews', newImages, 'new');
            } else {
                editImages.splice(i, 1);
                renderThumbs('editPreviews', editImages, 'edit');
            }
        }

        function isDelivered(st) {
            return st === "واصل" || st === "تم التسليم" || st === "تمت المحاسبة";
        }

        function updateStats() {
            let sales = 0, cash = 0, totalCount = 0, deliveredCount = 0;
            orders.forEach(o => {
                const p = Number(o.price) || 0;
                if (o.status !== "راجع") {
                    sales += p;
                    totalCount++;
                }
                if (isDelivered(o.status)) {
                    cash += p;
                    deliveredCount++;
                }
            });
            document.getElementById("totalSales").innerText = sales.toLocaleString() + " د.ع";
            document.getElementById("totalCount").innerText = `${totalCount} طلب مسجل`;
            document.getElementById("totalCash").innerText = cash.toLocaleString() + " د.ع";
            document.getElementById("deliveredCount").innerText = `${deliveredCount} طلبات واصلة`;
        }

        function renderUI() {
            const list = document.getElementById("ordersList");
            list.innerHTML = "";
            const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();

            updateStats();

            // ترتيب دائم: أحدث حركة للطلب تظهر أولاً
            let display = [...orders];
            display.sort((a, b) => {
                const timeA = a.updatedAt || a.timestamp || a.date || 0;
                const timeB = b.updatedAt || b.timestamp || b.date || 0;
                return timeB - timeA;
            });

            if (q) {
                display = display.filter(o => 
                    (o.name || "").toLowerCase().includes(q) ||
                    (o.phone || "").toLowerCase().includes(q) ||
                    (o.addr || "").toLowerCase().includes(q)
                );
            }

            if (display.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#64748b; padding:40px; font-size:14px;">لا توجد طلبات معروضة حالياً</p>`;
                return;
            }

            display.forEach(o => {
                let st = o.status || "بالطريق";
                let cardClass = "";
                let pillClass = "shipping";
                let pillText = "بالطريق 🚚";

                if (isDelivered(st)) { cardClass = "delivered"; pillClass = "done"; pillText = "واصل ✅"; }
                else if (st === "مؤجل") { cardClass = "postponed"; pillClass = "post"; pillText = "مؤجل ⏳"; }
                else if (st === "راجع") { cardClass = "returned"; pillClass = "ret"; pillText = "راجع ❌"; }

                const p = Number(o.price) || 0;
                let fee = 0;
                if (o.fee !== undefined) fee = Number(o.fee);
                else if (o.isProvince || (o.method && o.method.includes("المحافظات"))) fee = 5000;

                const total = p + fee;
                const timeText = formatDateTime(o.updatedAt || o.timestamp || o.date);

                let imgs = Array.isArray(o.images) ? o.images : (o.img ? [o.img] : []);
                let imgsHtml = "";
                if (imgs.length > 0) {
                    imgsHtml = `<div class="gallery">` +
                        imgs.map(s => `<img src="${s}" onclick="viewImg('${s}')">`).join("") +
                        `</div>`;
                }

                list.innerHTML += `
                    <div class="order-card ${cardClass}">
                        <div class="card-header">
                            <span class="cust-name">${o.name}</span>
                            <span class="order-date">🕒 ${timeText}</span>
                        </div>
                        <div class="status-pill ${pillClass}">الحالة: ${pillText}</div>
                        <div class="card-body">
                            📍 العنوان: ${o.addr || 'غير محدد'}<br>
                            💵 سعر القطع: <strong>${p.toLocaleString()} د.ع</strong> ${fee > 0 ? `| شحن محافظات: <strong>${fee.toLocaleString()} د.ع</strong>` : '| <strong>بدون شحن</strong>'}<br>
                            💰 <span class="price-highlight">المطلوب قبضه: ${total.toLocaleString()} د.ع</span>
                        </div>
                        ${imgsHtml}
                        ${o.notes ? `<div class="note-box">📝 ${o.notes}</div>` : ''}
                        <div class="btn-row">
                            ${o.phone ? `<a href="tel:${o.phone}" class="btn-call">📞 اتصال</a>` : ''}
                            <button class="btn-wa" onclick="shareWhatsApp('${o.id}')">📤 الوصل</button>
                            <button class="btn-done" onclick="changeStatus('${o.id}', 'واصل')">✅ واصل</button>
                            <button class="btn-post" onclick="changeStatus('${o.id}', 'مؤجل')">⏳ مؤجل</button>
                            <button class="btn-ret" onclick="changeStatus('${o.id}', 'راجع')">❌ راجع</button>
                            <button class="btn-edit" onclick="openEditModal('${o.id}')">✏️ تعديل</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeStatus(id, newStatus) {
            const now = Date.now();
            orders = orders.map(o => {
                if (o.id === id) {
                    return { ...o, status: newStatus, updatedAt: now };
                }
                return o;
            });
            renderUI();
            saveLocal();
            syncCloud();
        }

        function createOrder() {
            const name = document.getElementById("cName").value.trim();
            const phone = document.getElementById("cPhone").value.trim();
            const addr = document.getElementById("cAddr").value.trim();
            const price = parseFloat(document.getElementById("cPrice").value) || 0;
            const isProvince = document.getElementById("cProvince").checked;
            const notes = document.getElementById("cNotes").value.trim();

            if (!name) { alert("اكتب اسم الزبون"); return; }

            const fee = isProvince ? 5000 : 0;
            const now = Date.now();

            const newObj = {
                id: "id_" + now,
                name, phone, addr, price, fee, isProvince, notes,
                timestamp: now,
                updatedAt: now,
                images: [...newImages],
                status: "بالطريق"
            };

            orders.unshift(newObj);
            closeAddModal();
            renderUI();
            saveLocal();
            syncCloud();

            document.getElementById("cName").value = "";
            document.getElementById("cPhone").value = "";
            document.getElementById("cAddr").value = "";
            document.getElementById("cPrice").value = "";
            document.getElementById("cProvince").checked = false;
            document.getElementById("cNotes").value = "";
            document.getElementById("addPreviews").innerHTML = "";
            newImages = [];
            recalcAdd();
        }

        function openEditModal(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            document.getElementById("editId").value = o.id;
            document.getElementById("editName").value = o.name || "";
            document.getElementById("editPhone").value = o.phone || "";
            document.getElementById("editAddr").value = o.addr || "";
            document.getElementById("editPrice").value = o.price || 0;
            document.getElementById("editProvince").checked = Boolean(o.isProvince || (o.fee && o.fee > 0));
            document.getElementById("editNotes").value = o.notes || "";

            editImages = Array.isArray(o.images) ? [...o.images] : (o.img ? [o.img] : []);
            renderThumbs('editPreviews', editImages, 'edit');
            document.getElementById("editModal").style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
            editImages = [];
        }

        function saveEdit() {
            const id = document.getElementById("editId").value;
            const name = document.getElementById("editName").value.trim();
            const phone = document.getElementById("editPhone").value.trim();
            const addr = document.getElementById("editAddr").value.trim();
            const price = parseFloat(document.getElementById("editPrice").value) || 0;
            const isProvince = document.getElementById("editProvince").checked;
            const notes = document.getElementById("editNotes").value.trim();

            if (!name) { alert("اكتب اسم الزبون"); return; }

            const fee = isProvince ? 5000 : 0;
            const now = Date.now();

            orders = orders.map(o => {
                if (o.id === id) {
                    return {
                        ...o,
                        name, phone, addr, price, fee, isProvince, notes,
                        images: [...editImages],
                        updatedAt: now
                    };
                }
                return o;
            });

            closeEditModal();
            renderUI();
            saveLocal();
            syncCloud();
        }

        function openAddModal() { document.getElementById("addModal").style.display = "flex"; }
        function closeAddModal() { document.getElementById("addModal").style.display = "none"; }

        function syncCloud() {
            document.getElementById("netStatus").innerText = "⏳ جاري الحفظ...";
            fetch(FIREBASE_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orders)
            }).then(() => {
                document.getElementById("netStatus").innerText = "🟢 متزامن مع Firebase";
            }).catch(() => {
                document.getElementById("netStatus").innerText = "🟢 محفوظ بالتلفون";
            });
        }

        function fetchOrders() {
            document.getElementById("netStatus").innerText = "⏳ جلب البيانات...";
            fetch(FIREBASE_URL)
                .then(r => r.json())
                .then(data => {
                    if (data) {
                        let list = [];
                        if (Array.isArray(data)) list = data;
                        else if (typeof data === 'object') list = Object.keys(data).map(k => ({ ...data[k], id: k }));

                        if (list.length > 0) {
                            const map = new Map();
                            orders.forEach(o => { if (o && o.id) map.set(o.id, o); });
                            list.forEach(o => { if (o && o.id) map.set(o.id, o); });
                            orders = Array.from(map.values());

                            renderUI();
                            saveLocal();
                        }
                    }
                    document.getElementById("netStatus").innerText = "🟢 متصل وشغال";
                }).catch(() => {
                    document.getElementById("netStatus").innerText = "🟢 وضع الأوفلاين";
                });
        }

        function shareWhatsApp(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            const fee = (o.fee !== undefined) ? Number(o.fee) : (o.isProvince ? 5000 : 0);
            const total = (Number(o.price) || 0) + fee;

            let msg = `📦 *تفاصيل الطلب* \n` +
                      `━━━━━━━━━━━━━━\n` +
                      `👤 *الزبون:* ${o.name}\n` +
                      `📞 *الهاتف:* ${o.phone || 'غير مسجل'}\n` +
                      `📍 *العنوان:* ${o.addr || 'غير محدد'}\n` +
                      `💰 *المبلغ المطلوب عند الاستلام:* ${total.toLocaleString()} دينار\n` +
                      `🚚 *الشحن:* ${fee > 0 ? 'شحن محافظات (+5,000)' : 'استلام مباشر'}\n`;
            if (o.notes) msg += `📝 *ملاحظات:* ${o.notes}\n`;

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function viewImg(src) {
            document.getElementById("viewerImg").src = src;
            document.getElementById("viewerModal").style.display = "flex";
        }

        recalcAdd();
        renderUI();
        fetchOrders();
    </script>
</body>
</html>
