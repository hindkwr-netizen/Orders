<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة الطلبات</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; padding: 10px 10px 85px 10px; color: #f8fafc; direction: rtl; }

        .top-bar { background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .net-tag { font-size: 12px; font-weight: bold; color: #34d399; }
        .btn-refresh { background: #0284c7; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .search-box { width: 100%; padding: 11px 14px; border: 2px solid #38bdf8; border-radius: 8px; font-size: 13px; background: #1e293b; color: #fff; margin-bottom: 12px; outline: none; }

        /* تجميع الأيام */
        .day-group { background: #1e293b; border: 1px solid #334155; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .day-header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .day-title { font-size: 14px; font-weight: bold; color: #38bdf8; }
        .day-meta { font-size: 11px; color: #94a3b8; text-align: left; }
        .day-meta strong { color: #34d399; }
        .day-content { padding: 10px; display: none; background: #0b1329; }
        .day-group.open .day-content { display: block; }
        .day-group.open .day-header { background: #24334d; border-color: #38bdf8; }

        /* كارت الطلب */
        .order-card { background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 8px; border: 1px solid #334155; border-right: 5px solid #38bdf8; }
        .order-card.delivered { border-right-color: #10b981; }
        .order-card.postponed { border-right-color: #a855f7; }
        .order-card.returned { border-right-color: #ef4444; opacity: 0.8; }

        .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .cust-name { font-size: 15px; font-weight: bold; color: #fff; }
        .order-time { font-size: 11px; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }

        .status-badge { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 5px; margin-bottom: 6px; }
        .badge-shipping { background: #082f49; color: #38bdf8; border: 1px solid #0284c7; }
        .badge-delivered { background: #064e3b; color: #34d399; border: 1px solid #059669; }
        .badge-postponed { background: #3b0764; color: #d8b4fe; border: 1px solid #9333ea; }
        .badge-returned { background: #450a0a; color: #f87171; border: 1px solid #dc2626; }

        .card-details { font-size: 13px; color: #cbd5e1; line-height: 1.7; margin-bottom: 6px; }
        .price-text { color: #38bdf8; font-weight: bold; font-size: 14px; }

        /* معرض الصور داخل الكارت */
        .gallery { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0; padding-bottom: 4px; }
        .gallery img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; flex-shrink: 0; cursor: pointer; }

        .note-tag { background: #0f172a; border: 1px dashed #f59e0b; padding: 4px 8px; border-radius: 5px; font-size: 11px; color: #fde047; margin-bottom: 6px; }

        .action-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .action-row button, .action-row a { border: 0; padding: 6px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-call { background: #22c55e; color: #fff; }
        .btn-wa { background: #0284c7; color: #fff; }
        .btn-done { background: #059669; color: #fff; }
        .btn-post { background: #9333ea; color: #fff; }
        .btn-ret { background: #dc2626; color: #fff; }
        .btn-edit { background: #f59e0b; color: #1e293b; margin-right: auto; }

        .fab { position: fixed; bottom: 18px; left: 18px; background: #2563eb; color: #fff; border: 0; border-radius: 50px; padding: 14px 22px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(37,99,235,0.5); cursor: pointer; z-index: 999; }

        /* نوافذ */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 12px; }
        .modal-box { background: #1e293b; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #38bdf8; text-align: center; }
        input[type="text"], input[type="tel"], input[type="number"], textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #475569; border-radius: 8px; font-size: 14px; background: #0f172a; color: #fff; }
        textarea { height: 50px; }

        .check-container { display: flex; align-items: center; gap: 8px; background: #0f172a; border: 1px solid #475569; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .check-container input { width: 18px; height: 18px; }
        .check-container span { font-size: 13px; font-weight: bold; color: #38bdf8; }

        .calc-preview { background: #0f172a; border: 1px solid #38bdf8; padding: 7px; border-radius: 6px; font-size: 12px; color: #38bdf8; text-align: center; font-weight: bold; margin-bottom: 8px; }
        .upload-label { display: block; background: #334155; padding: 9px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px dashed #38bdf8; margin-bottom: 8px; color: #38bdf8; }
        .previews { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
        .thumb-wrap { position: relative; flex-shrink: 0; }
        .thumb-wrap img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .thumb-del { position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; border: 0; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }

        .btn-confirm { background: #2563eb; color: #fff; border: 0; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-cancel { background: #475569; color: #fff; border: 0; width: 100%; padding: 9px; border-radius: 8px; font-weight: bold; margin-top: 6px; cursor: pointer; }
        .img-modal img { max-width: 95%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="net-tag" id="netStatus">🟢 النظام سريع ومنظم بالأيام</span>
        <button class="btn-refresh" onclick="fetchOrders()">🔄 تحديث</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث بالاسم أو الرقم أو العنوان..." oninput="renderUI()">

    <!-- الحاوية الأساسية للأيام -->
    <div id="daysContainer"></div>

    <button class="fab" onclick="openAddModal()">➕ طلب جديد</button>

    <!-- نافذة إضافة طلب -->
    <div id="addModal" class="modal">
        <div class="modal-box">
            <div class="modal-title">📦 تثبيت طلب جديد</div>
            <input type="text" id="cName" placeholder="اسم الزبون (مطلوب)">
            <input type="tel" id="cPhone" placeholder="رقم الهاتف">
            <input type="text" id="cAddr" placeholder="العنوان بالتفصيل">
            <input type="number" id="cPrice" placeholder="سعر القطع (دينار)" oninput="recalcAdd()">
            
            <label class="check-container">
                <input type="checkbox" id="cProvince" onchange="recalcAdd()">
                <span>شحن للمحافظات (+5,000 د.ع)</span>
            </label>

            <div id="calcView" class="calc-preview">المجموع عند الزبون: 0 د.ع</div>
            <textarea id="cNotes" placeholder="ملاحظات الطلب (اختياري)"></textarea>

            <label class="upload-label" for="fileInput">📷 اختيار صور المنتجات</label>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event, 'new')">
            <div id="addPreviews" class="previews"></div>

            <button type="button" class="btn-confirm" onclick="createOrder()">تثبيت الطلب</button>
            <button class="btn-cancel" onclick="closeAddModal()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة التعديل -->
    <div id="editModal" class="modal">
        <div class="modal-box">
            <div class="modal-title">✏️ تعديل الطلب</div>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="اسم الزبون">
            <input type="tel" id="editPhone" placeholder="رقم الهاتف">
            <input type="text" id="editAddr" placeholder="العنوان">
            <input type="number" id="editPrice" placeholder="سعر القطع">
            
            <label class="check-container">
                <input type="checkbox" id="editProvince">
                <span>شحن للمحافظات (+5,000 د.ع)</span>
            </label>

            <textarea id="editNotes" placeholder="ملاحظات"></textarea>

            <div id="editPreviews" class="previews"></div>
            <label class="upload-label" for="editFileInput">📷 إضافة صور أخرى</label>
            <input type="file" id="editFileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event, 'edit')">

            <button class="btn-confirm" style="background:#059669;" onclick="saveEdit()">💾 حفظ التعديل</button>
            <button class="btn-cancel" onclick="closeEditModal()">إلغاء</button>
        </div>
    </div>

    <div id="modalViewer" class="modal img-modal" onclick="this.style.display='none'">
        <img id="viewerImg" src="">
    </div>

    <script>
        const FIREBASE_URL = "https://orders-99674-default-rtdb.firebaseio.com/orders.json";
        const STORAGE_KEY = "orders_days_system_v2";

        let orders = [];
        let newImages = [];
        let editImages = [];
        let openedDays = new Set();

        function loadLocalData() {
            const keys = [
                STORAGE_KEY,
                "orders_days_system_v1",
                "orders_v9_light_cache",
                "orders_v8_stable",
                "orders_v7_delivery_system",
                "orders_v5_master"
            ];
            for (let k of keys) {
                try {
                    const raw = localStorage.getItem(k);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch(e) {}
            }
            return [];
        }

        orders = loadLocalData();

        function saveLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
            } catch(e) {
                // إذا امتلأت الذاكرة المحلية، يتم حفظ البيانات الأساسية لتفادي التجميد
                try {
                    const light = orders.map(o => ({
                        ...o,
                        images: (o.images && o.images.length > 0) ? [o.images[0]] : []
                    }));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(light));
                } catch(err) {}
            }
        }

        function recalcAdd() {
            const p = parseFloat(document.getElementById("cPrice").value) || 0;
            const fee = document.getElementById("cProvince").checked ? 5000 : 0;
            document.getElementById("calcView").innerText = `المجموع عند الزبون: ${(p + fee).toLocaleString()} د.ع ${fee > 0 ? '(شحن 5,000 د.ع)' : '(بدون شحن)'}`;
        }

        function getDateStr(ts) {
            const d = new Date(ts || Date.now());
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatClock(ts) {
            const d = new Date(ts || Date.now());
            let hours = d.getHours();
            const min = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12 || 12;
            return `${hours}:${min} ${ampm}`;
        }

        // ضغط ناعم وسريع للصور بحيث تكون خفيفة جداً وعالية الوضوح للهاتف
        function handleImageUpload(e, type) {
            const files = Array.from(e.target.files);
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const cvs = document.createElement("canvas");
                        let w = img.width, h = img.height;
                        const max = 220; // أبعاد خفيفة جداً تمنع أي ثقل
                        if (w > h && w > max) { h *= max / w; w = max; }
                        else if (h > max) { w *= max / h; h = max; }
                        cvs.width = w; cvs.height = h;
                        cvs.getContext("2d").drawImage(img, 0, 0, w, h);
                        const b64 = cvs.toDataURL("image/jpeg", 0.4);

                        if (type === 'new') {
                            newImages.push(b64);
                            renderThumbs('addPreviews', newImages, 'new');
                        } else {
                            editImages.push(b64);
                            renderThumbs('editPreviews', editImages, 'edit');
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(f);
            });
        }

        function renderThumbs(elemId, arr, type) {
            const el = document.getElementById(elemId);
            el.innerHTML = "";
            arr.forEach((src, i) => {
                el.innerHTML += `
                    <div class="thumb-wrap">
                        <img src="${src}">
                        <button type="button" class="thumb-del" onclick="removeThumb('${type}', ${i})">✕</button>
                    </div>
                `;
            });
        }

        function removeThumb(type, i) {
            if (type === 'new') {
                newImages.splice(i, 1);
                renderThumbs('addPreviews', newImages, 'new');
            } else {
                editImages.splice(i, 1);
                renderThumbs('editPreviews', editImages, 'edit');
            }
        }

        function isDelivered(st) {
            return st === "واصل" || st === "تم التسليم" || st === "تمت المحاسبة";
        }

        function toggleDay(dateKey) {
            if (openedDays.has(dateKey)) {
                openedDays.delete(dateKey);
            } else {
                openedDays.add(dateKey);
            }
            renderUI();
        }

        function renderUI() {
            const container = document.getElementById("daysContainer");
            container.innerHTML = "";
            const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();

            const todayKey = getDateStr(Date.now());
            if (openedDays.size === 0) openedDays.add(todayKey);

            const groups = {};
            orders.forEach(o => {
                const dayKey = getDateStr(o.timestamp || o.date);
                if (!groups[dayKey]) groups[dayKey] = [];
                groups[dayKey].push(o);
            });

            const sortedDays = Object.keys(groups).sort((a, b) => b.localeCompare(a));

            if (sortedDays.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#64748b; padding:35px; font-size:13px;">لا توجد طلبات مسجلة بعد</p>`;
                return;
            }

            sortedDays.forEach(dayKey => {
                let dayOrders = groups[dayKey];

                if (q) {
                    dayOrders = dayOrders.filter(o => 
                        (o.name || "").toLowerCase().includes(q) || 
                        (o.phone || "").toLowerCase().includes(q) || 
                        (o.addr || "").toLowerCase().includes(q)
                    );
                    if (dayOrders.length === 0) return;
                }

                let daySales = 0;
                let dayCash = 0;
                let dayCount = 0;

                dayOrders.forEach(o => {
                    const p = Number(o.price) || 0;
                    if (o.status !== "راجع") {
                        daySales += p;
                        dayCount++;
                    }
                    if (isDelivered(o.status)) {
                        dayCash += p;
                    }
                });

                dayOrders.sort((a, b) => (b.updatedAt || b.timestamp || 0) - (a.updatedAt || a.timestamp || 0));

                const isOpen = openedDays.has(dayKey) || q.length > 0;
                const isToday = (dayKey === todayKey);

                let ordersHtml = "";
                dayOrders.forEach(o => {
                    let st = o.status || "بالطريق";
                    let cardClass = "";
                    let badgeClass = "badge-shipping";
                    let badgeText = "بالطريق 🚚";

                    if (isDelivered(st)) { cardClass = "delivered"; badgeClass = "badge-delivered"; badgeText = "واصل ✅"; }
                    else if (st === "مؤجل") { cardClass = "postponed"; badgeClass = "badge-postponed"; badgeText = "مؤجل ⏳"; }
                    else if (st === "راجع") { cardClass = "returned"; badgeClass = "badge-returned"; badgeText = "راجع ❌"; }

                    const price = Number(o.price) || 0;
                    let fee = (o.fee !== undefined) ? Number(o.fee) : (o.isProvince ? 5000 : 0);
                    const total = price + fee;

                    // عرض كافة الصور بسلاسة عبر التحميل الكسول
                    let imgs = Array.isArray(o.images) ? o.images : (o.img ? [o.img] : []);
                    let imgsHtml = "";
                    if (imgs.length > 0) {
                        imgsHtml = `<div class="gallery">` +
                            imgs.map(s => `<img src="${s}" loading="lazy" onclick="viewImg('${s}')">`).join("") +
                            `</div>`;
                    }

                    ordersHtml += `
                        <div class="order-card ${cardClass}">
                            <div class="card-head">
                                <span class="cust-name">${o.name}</span>
                                <span class="order-time">🕒 ${formatClock(o.timestamp)}</span>
                            </div>
                            <span class="status-badge ${badgeClass}">${badgeText}</span>
                            <div class="card-details">
                                📍 العنوان: ${o.addr || 'غير محدد'}<br>
                                💵 سعر القطع: <strong>${price.toLocaleString()} د.ع</strong> ${fee > 0 ? `| شحن محافظات: <strong>${fee.toLocaleString()} د.ع</strong>` : '| <strong>بدون شحن</strong>'}<br>
                                💰 <span class="price-text">المطلوب قبضه: ${total.toLocaleString()} د.ع</span>
                            </div>
                            ${imgsHtml}
                            ${o.notes ? `<div class="note-tag">📝 ${o.notes}</div>` : ''}
                            <div class="action-row">
                                ${o.phone ? `<a href="tel:${o.phone}" class
