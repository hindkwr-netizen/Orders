<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الطلبات</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; padding: 12px; color: #f8fafc; direction: rtl; }

        .header-bar { background: #1e293b; border: 1px solid #10b981; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .status-badge { font-size: 13px; font-weight: bold; color: #34d399; }
        .header-actions { display: flex; gap: 6px; }
        .btn-reload { background: #0284c7; color: white; border: none; padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-export { background: #10b981; color: white; border: none; padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-box { background: #1e293b; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .stat-box.full { grid-column: span 2; background: #0284c7; border: none; }
        .stat-title { font-size: 11px; opacity: 0.9; }
        .stat-val { font-size: 15px; font-weight: bold; margin-top: 3px; }

        .box { background: #1e293b; border-radius: 10px; padding: 14px; border: 1px solid #334155; margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #475569; border-radius: 8px; font-size: 14px; background: #0f172a; color: #fff; }
        textarea { height: 50px; resize: vertical; }

        .search-box { width: 100%; padding: 11px 14px; border: 2px solid #38bdf8; border-radius: 8px; font-size: 14px; background: #1e293b; color: #fff; margin-bottom: 12px; outline: none; }
        .search-box::placeholder { color: #94a3b8; }

        .calc-box { background: #0f172a; border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; font-size: 13px; color: #38bdf8; text-align: center; font-weight: bold; margin-bottom: 8px; line-height: 1.6; }

        .upload-btn { display: block; background: #334155; padding: 9px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px dashed #38bdf8; margin-bottom: 8px; color: #38bdf8; }
        .previews { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
        .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #38bdf8; flex-shrink: 0; }

        .btn-add { background: #2563eb; color: #fff; border: 0; width: 100%; padding: 13px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
        .tab-btn { background: #334155; color: #cbd5e1; border: 0; padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }

        .card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .card.pending { border-right: 5px solid #f59e0b; }
        .card.shipping { border-right: 5px solid #38bdf8; }
        .card.delivered { border-right: 5px solid #10b981; }
        .card.returned { border-right: 5px solid #ef4444; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .cust-name { font-size: 15px; font-weight: bold; color: #fff; }
        .header-tags { display: flex; gap: 4px; align-items: center; }
        .order-date { font-size: 11px; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }
        .item-code { background: #334155; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .card-details { font-size: 13px; color: #cbd5e1; line-height: 1.7; margin-bottom: 8px; }

        .img-gallery { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
        .img-gallery img { width: 75px; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; cursor: pointer; flex-shrink: 0; }

        .note-tag { background: #334155; border: 1px dashed #f59e0b; padding: 6px; border-radius: 6px; font-size: 12px; color: #fde047; margin-bottom: 8px; }

        .action-btns { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
        .action-btns button, .action-btns a { border: 0; padding: 6px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-call { background: #22c55e; color: #fff; }
        .btn-wa-cust { background: #25d366; color: #fff; }
        .btn-wa-driver { background: #0284c7; color: #fff; }
        .btn-edit { background: #f59e0b; color: #1e293b; }
        .btn-status-ship { background: #0284c7; color: #fff; }
        .btn-status-done { background: #059669; color: #fff; }
        .btn-status-back { background: #dc2626; color: #fff; }
        .btn-del { background: #7f1d1d; color: #fca5a5; margin-right: auto; }

        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 12px; }
        .modal-content { background: #1e293b; border-radius: 12px; padding: 16px; width: 100%; max-width: 420px; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #38bdf8; text-align: center; }
        .modal-close { background: #475569; color: #fff; border: 0; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 6px; cursor: pointer; }
        .img-modal img { max-width: 95%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <span class="status-badge" id="netStatus">🟢 متزامن مع صديقك</span>
        <div class="header-actions">
            <button class="btn-export" onclick="exportToExcel()">📊 تصدير Excel</button>
            <button class="btn-reload" onclick="fetchOrders()">🔄 سحب البيانات</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-title">المبالغ الواصلة</div>
            <div class="stat-val" style="color:#34d399;" id="boxDelivered">0 د.ع</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">مبالغ في الطريق</div>
            <div class="stat-val" style="color:#38bdf8;" id="boxShipping">0 د.ع</div>
        </div>
        <div class="stat-box full">
            <div class="stat-title">المجموع الكلي مع التوصيل</div>
            <div class="stat-val" id="boxTotal">0 د.ع</div>
        </div>
    </div>

    <!-- خانة البحث السريع -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث بالاسم، الهاتف، الكود، أو التاريخ..." oninput="handleSearch()">

    <div class="box">
        <h3 style="margin-bottom: 10px; font-size: 15px;">إضافة طلب جديد 📦</h3>
        <input type="text" id="cName" placeholder="اسم الزبون (مطلوب)">
        <input type="tel" id="cPhone" placeholder="رقم الهاتف">
        <input type="text" id="cCode" placeholder="كود القطعة">
        <input type="text" id="cAddr" placeholder="العنوان">
        <input type="number" id="cPrice" placeholder="السعر قبل التوصيل (دينار)" oninput="recalc()">
        
        <select id="cMethod" onchange="recalc()">
            <option value="داخل خانقين">توصيل: داخل خانقين (+2,000 د.ع)</option>
            <option value="المحافظات">توصيل: خارج خانقين / المحافظات (+5,000 د.ع)</option>
            <option value="بدون توصيل">بدون توصيل (استلام مباشر 0 د.ع)</option>
        </select>

        <div id="calcView" class="calc-box">
            السعر قبل التوصيل: 0 د.ع | التوصيل: 2,000 د.ع<br>
            <strong>السعر بعد التوصيل: 2,000 د.ع</strong>
        </div>

        <textarea id="cNotes" placeholder="ملاحظات إضافية (اختياري)"></textarea>

        <label class="upload-btn" for="fileInput">📷 اختيار صور أو سكرين شوت</label>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="processImages(event)">
        <div id="previewArea" class="previews"></div>

        <button type="button" class="btn-add" onclick="createOrder()">تثبيت الطلب</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterTab('all', this)">الكل (<span id="totalBadge">0</span>)</button>
        <button class="tab-btn" onclick="filterTab('داخل خانقين', this)">داخل خانقين</button>
        <button class="tab-btn" onclick="filterTab('المحافظات', this)">خارج خانقين</button>
        <button class="tab-btn" onclick="filterTab('بدون توصيل', this)">بدون توصيل</button>
        <button class="tab-btn" onclick="filterTab('بالطريق', this)">🚚 بالطريق</button>
        <button class="tab-btn" onclick="filterTab('واصل', this)">✅ واصل</button>
        <button class="tab-btn" onclick="filterTab('راجع', this)">❌ راجع</button>
    </div>

    <div id="ordersList"></div>

    <!-- نافذة تعديل الطلب -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✏️ تعديل بيانات الطلب</div>
            <input type="hidden" id="editId">
            <label style="font-size:12px; color:#94a3b8;">اسم الزبون:</label>
            <input type="text" id="editName">
            <label style="font-size:12px; color:#94a3b8;">رقم الهاتف:</label>
            <input type="tel" id="editPhone">
            <label style="font-size:12px; color:#94a3b8;">كود القطعة:</label>
            <input type="text" id="editCode">
            <label style="font-size:12px; color:#94a3b8;">العنوان:</label>
            <input type="text" id="editAddr">
            <label style="font-size:12px; color:#94a3b8;">السعر قبل التوصيل:</label>
            <input type="number" id="editPrice">
            <label style="font-size:12px; color:#94a3b8;">طريقة التوصيل:</label>
            <select id="editMethod">
                <option value="داخل خانقين">داخل خانقين (+2,000 د.ع)</option>
                <option value="المحافظات">خارج خانقين / المحافظات (+5,000 د.ع)</option>
                <option value="بدون توصيل">بدون توصيل (0 د.ع)</option>
            </select>
            <label style="font-size:12px; color:#94a3b8;">ملاحظات:</label>
            <textarea id="editNotes"></textarea>
            <button class="btn-add" style="background:#059669; margin-top:8px;" onclick="saveEditedOrder()">💾 حفظ التعديلات</button>
            <button class="modal-close" onclick="closeEditModal()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة تكبير الصورة -->
    <div id="modal" class="modal img-modal" onclick="this.style.display='none'">
        <img id="modalViewer" src="">
    </div>

    <script>
        const FIREBASE_URL = "https://orders-99674-default-rtdb.firebaseio.com/orders.json";
        const LOCAL_KEY = "simple_orders_storage_v1";

        let orders = [];
        let selectedTab = "all";
        let searchQuery = "";
        let activeImages = [];

        try {
            const saved = localStorage.getItem(LOCAL_KEY);
            if (saved) orders = JSON.parse(saved);
        } catch(e) {}

        function calcFee(method) {
            if (method === "داخل خانقين") return 2000;
            if (method === "المحافظات") return 5000;
            return 0;
        }

        function recalc() {
            const p = parseFloat(document.getElementById("cPrice").value) || 0;
            const m = document.getElementById("cMethod").value;
            const f = calcFee(m);
            const total = p + f;
            document.getElementById("calcView").innerHTML = 
                `السعر قبل التوصيل: ${p.toLocaleString()} د.ع | التوصيل: ${f.toLocaleString()} د.ع<br>` +
                `<strong style="color:#38bdf8;">السعر بعد التوصيل: ${total.toLocaleString()} د.ع</strong>`;
        }

        function formatDateTime(timestamp) {
            const d = new Date(timestamp || Date.now());
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12 || 12;
            return `${year}/${month}/${day} - ${hours}:${minutes} ${ampm}`;
        }

        function processImages(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const r = new FileReader();
                r.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement("canvas");
                        let w = img.width, h = img.height;
                        const max = 400;
                        if (w > h && w > max) { h *= max / w; w = max; }
                        else if (h > max) { w *= max / h; h = max; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        const b64 = canvas.toDataURL("image/jpeg", 0.6);
                        activeImages.push(b64);
                        renderThumbs();
                    };
                    img.src = evt.target.result;
                };
                r.readAsDataURL(file);
            });
        }

        function renderThumbs() {
            const el = document.getElementById("previewArea");
            el.innerHTML = "";
            activeImages.forEach(src => {
                el.innerHTML += `<img src="${src}" class="thumb">`;
            });
        }

        function refreshStats() {
            let delivered = 0, shipping = 0, total = 0;
            orders.forEach(o => {
                const p = Number(o.total) || 0;
                if (o.status === "واصل") delivered += p;
                if (o.status === "بالطريق" || o.status === "قيد التجهيز") shipping += p;
                if (o.status !== "راجع") total += p;
            });
            document.getElementById("boxDelivered").innerText = delivered.toLocaleString() + " د.ع";
            document.getElementById("boxShipping").innerText = shipping.toLocaleString() + " د.ع";
            document.getElementById("boxTotal").innerText = total.toLocaleString() + " د.ع";
        }

        function handleSearch() {
            searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
            renderUI();
        }

        function renderUI() {
            const list = document.getElementById("ordersList");
            list.innerHTML = "";
            document.getElementById("totalBadge").innerText = orders.length;

            let filtered = orders.filter(o => {
                let matchesTab = true;
                if (selectedTab === "داخل خانقين") matchesTab = (o.method === "داخل خانقين");
                else if (selectedTab === "المحافظات") matchesTab = (o.method === "المحافظات");
                else if (selectedTab === "بدون توصيل") matchesTab = (o.method === "بدون توصيل");
                else if (selectedTab !== "all") matchesTab = (o.status === selectedTab);

                if (!matchesTab) return false;

                if (searchQuery) {
                    const name = (o.name || "").toLowerCase();
                    const phone = (o.phone || "").toLowerCase();
                    const code = (o.code || "").toLowerCase();
                    const addr = (o.addr || "").toLowerCase();
                    const dateStr = (o.formattedDate || "").toLowerCase();
                    return name.includes(searchQuery) || phone.includes(searchQuery) || code.includes(searchQuery) || addr.includes(searchQuery) || dateStr.includes(searchQuery);
                }
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#64748b; padding:25px;">لا توجد طلبات مطابقة</p>`;
                refreshStats();
                return;
            }

            filtered.forEach(o => {
                let statusClass = "pending";
                if (o.status === "بالطريق") statusClass = "shipping";
                if (o.status === "واصل") statusClass = "delivered";
                if (o.status === "راجع") statusClass = "returned";

                let imgsHtml = "";
                if (o.images && o.images.length > 0) {
                    imgsHtml = `<div class="img-gallery">` +
                        o.images.map(img => `<img src="${img}" onclick="viewImg('${img}')">`).join("") +
                        `</div>`;
                }

                const displayDate = o.formattedDate || formatDateTime(o.timestamp);

                list.innerHTML += `
                    <div class="card ${statusClass}">
                        <div class="card-header">
                            <span class="cust-name">${o.name}</span>
                            <div class="header-tags">
                                <span class="order-date">🕒 ${displayDate}</span>
                                <span class="item-code">كود: ${o.code || '---'}</span>
                            </div>
                        </div>
                        <div class="card-details">
                            📍 العنوان: ${o.addr || 'غير محدد'}<br>
                            💵 السعر قبل التوصيل: <strong>${Number(o.price).toLocaleString()} د.ع</strong><br>
                            🚚 أجور التوصيل: <strong>${Number(o.fee).toLocaleString()} د.ع</strong> (${o.method})<br>
                            💰 <span style="color:#38bdf8; font-weight:bold;">السعر بعد التوصيل: ${Number(o.total).toLocaleString()} د.ع</span><br>
                            الحالة: <strong>${o.status}</strong>
                        </div>
                        ${imgsHtml}
                        ${o.notes ? `<div class="note-tag">📝 ${o.notes}</div>` : ''}
                        <div class="action-btns">
                            ${o.phone ? `<a href="tel:${o.phone}" class="btn-call">📞 اتصال</a>` : ''}
                            <button class="btn-wa-cust" onclick="shareToCustomer('${o.id}')">👤 وصل الزبون</button>
                            <button class="btn-wa-driver" onclick="shareToDriver('${o.id}')">🚚 وصل المندوب</button>
                            <button class="btn-edit" onclick="openEditModal('${o.id}')">✏️ تعديل</button>
                            <button class="btn-status-ship" onclick="updateStatus('${o.id}', 'بالطريق')">بالطريق</button>
                            <button class="btn-status-done" onclick="updateStatus('${o.id}', 'واصل')">واصل</button>
                            <button class="btn-status-back" onclick="updateStatus('${o.id}', 'راجع')">راجع</button>
                            <button class="btn-del" onclick="deleteOrder('${o.id}')">حذف</button>
                        </div>
                    </div>
                `;
            });

            refreshStats();
        }

        function createOrder() {
            const name = document.getElementById("cName").value.trim();
            const phone = document.getElementById("cPhone").value.trim();
            const code = document.getElementById("cCode").value.trim();
            const addr = document.getElementById("cAddr").value.trim();
            const price = parseFloat(document.getElementById("cPrice").value) || 0;
            const m
