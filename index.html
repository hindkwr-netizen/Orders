<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات والتوصيل</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; padding: 10px 10px 85px 10px; color: #f8fafc; direction: rtl; }

        .header-bar { background: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .net-badge { font-size: 11px; font-weight: bold; color: #34d399; }
        .btn-sync { background: #0284c7; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

        /* صندوق الكاش المحاسب عليه */
        .cash-box { background: linear-gradient(135deg, #065f46, #047857); border: 1px solid #10b981; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .cash-title { font-size: 11px; color: #a7f3d0; font-weight: bold; }
        .cash-val { font-size: 16px; font-weight: 900; color: #fff; }
        .cash-count { font-size: 11px; color: #d1fae5; background: rgba(0,0,0,0.25); padding: 3px 8px; border-radius: 12px; }

        /* شريط فلتر الوقت */
        .time-filter-bar { background: #1e293b; border: 1px solid #38bdf8; border-radius: 10px; padding: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
        .time-buttons { display: flex; gap: 5px; overflow-x: auto; }
        .btn-time { background: #334155; color: #cbd5e1; border: 0; padding: 6px 11px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; flex: 1; }
        .btn-time.active { background: #0284c7; color: #fff; }
        .custom-date-picker { width: 100%; padding: 6px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 12px; outline: none; }

        /* تبويبات المراحل */
        .main-tabs { display: flex; gap: 5px; margin-bottom: 8px; overflow-x: auto; }
        .main-tab-btn { padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; flex: 1; text-align: center; }
        .main-tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

        .search-box { width: 100%; padding: 9px 12px; border: 1px solid #475569; border-radius: 8px; font-size: 13px; background: #1e293b; color: #fff; margin-bottom: 10px; outline: none; }

        /* كارت الطلب */
        .card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; border-right: 6px solid #38bdf8; }
        .card.delivered-wait { border-right-color: #f59e0b; }
        .card.settled { border-right-color: #10b981; }
        .card.returned { border-right-color: #ef4444; opacity: 0.75; }
        .card.postponed { border-right-color: #a855f7; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .cust-name { font-size: 15px; font-weight: bold; color: #fff; }
        .order-time { font-size: 11px; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }
        .badge-status { font-size: 11px; padding: 2px 6px; border-radius: 5px; font-weight: bold; display: inline-block; margin-bottom: 6px; }

        .card-details { font-size: 13px; color: #cbd5e1; line-height: 1.7; margin-bottom: 8px; }
        .price-highlight { color: #38bdf8; font-size: 14px; font-weight: 900; }

        .driver-note-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 6px 8px; border-radius: 6px; font-size: 12px; color: #38bdf8; margin-bottom: 8px; }

        .img-gallery { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
        .img-gallery img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; cursor: pointer; flex-shrink: 0; }

        .action-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
        .action-row button, .action-row a { border: 0; padding: 7px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .btn-call { background: #22c55e; color: #fff; }
        .btn-share { background: #0284c7; color: #fff; }
        
        /* زر تسليم المندوب */
        .btn-driver-deliver { background: #eab308; color: #0f172a; border: 1px solid #ca8a04; }
        /* زر تصفية واستلام الكاش للمحل */
        .btn-settle-cash { background: #10b981; color: #fff; border: 1px solid #059669; }
        
        .btn-post { background: #9333ea; color: #fff; }
        .btn-ret { background: #dc2626; color: #fff; }
        .btn-edit { background: #f59e0b; color: #1e293b; margin-right: auto; }

        .fab-add { position: fixed; bottom: 18px; left: 18px; background: #2563eb; color: #fff; border: none; border-radius: 50px; padding: 13px 20px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5); cursor: pointer; z-index: 999; }

        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 12px; }
        .modal-content { background: #1e293b; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #38bdf8; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #475569; border-radius: 8px; font-size: 14px; background: #0f172a; color: #fff; }
        textarea { height: 50px; }
        .calc-preview { background: #0f172a; border: 1px solid #38bdf8; padding: 6px; border-radius: 6px; font-size: 12px; color: #38bdf8; text-align: center; font-weight: bold; margin-bottom: 8px; }
        .upload-label { display: block; background: #334155; padding: 9px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px dashed #38bdf8; margin-bottom: 8px; color: #38bdf8; }
        .previews { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
        .thumb-wrap { position: relative; flex-shrink: 0; }
        .thumb-wrap img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; }
        .thumb-del { position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; border: 0; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }
        .btn-confirm { background: #2563eb; color: #fff; border: 0; width: 100%; padding: 11px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-cancel { background: #475569; color: #fff; border: 0; width: 100%; padding: 9px; border-radius: 8px; font-weight: bold; margin-top: 6px; cursor: pointer; }
        .img-modal img { max-width: 95%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <span class="net-badge" id="netStatus">🟢 متزامن وسريع</span>
        <button class="btn-sync" onclick="fetchOrders()">🔄 تحديث</button>
    </div>

    <!-- صندوق الكاش المقبوض الذي تمت المحاسبة عليه -->
    <div class="cash-box">
        <div>
            <div class="cash-title" id="cashTitle">💰 الكاش المقبوض المستلم من المندوب</div>
            <div class="cash-val" id="todayCash">0 د.ع</div>
        </div>
        <div class="cash-count" id="todayDeliveredCount">0 طلبات تمت محاسبتها</div>
    </div>

    <!-- شريط فلتر الوقت -->
    <div class="time-filter-bar">
        <div class="time-buttons">
            <button class="btn-time active" id="timeToday" onclick="setTimeFilter('today', this)">اليوم</button>
            <button class="btn-time" onclick="setTimeFilter('yesterday', this)">البارحة</button>
            <button class="btn-time" onclick="setTimeFilter('all', this)">كل الأوقات</button>
        </div>
        <input type="date" id="customDatePicker" class="custom-date-picker" onchange="onCustomDatePick(this.value)">
    </div>

    <!-- تبويبات المراحل: للمندوب، المحاسبة، والأرشيف -->
    <div class="main-tabs">
        <button class="main-tab-btn active" id="tabDriver" onclick="switchMainTab('driver')">🚚 بيد المندوب (<span id="driverCount">0</span>)</button>
        <button class="main-tab-btn" id="tabWaitSettle" onclick="switchMainTab('waitSettle')">⏳ واصل بانتظار الكاش (<span id="waitSettleCount">0</span>)</button>
        <button class="main-tab-btn" id="tabSettled" onclick="switchMainTab('settled')">✅ تمت المحاسبة</button>
        <button class="main-tab-btn" id="tabArchive" onclick="switchMainTab('archive')">❌ راجع ومؤجل</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث بالاسم أو الرقم أو العنوان..." oninput="renderUI()">

    <!-- قائمة الطلبات المعروضة -->
    <div id="ordersList"></div>

    <button class="fab-add" onclick="openAddModal()">➕ طلب جديد</button>

    <!-- نافذة المندوب عند تسليم الطلب لكتابة الملاحظة -->
    <div id="driverDeliverModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🚚 تأكيد تسليم الشحنة للزبون</div>
            <input type="hidden" id="deliverOrderId">
            <p id="deliverOrderInfo" style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px; text-align: center;"></p>
            <label style="font-size:12px; color:#94a3b8;">ملاحظة المندوب عند الاستلام (اختياري):</label>
            <textarea id="deliverDriverNote" placeholder="مثال: استلم كامل، أو استلم قطعتين، أو حول زين كاش..."></textarea>
            <button type="button" class="btn-confirm" style="background: #eab308; color:#0f172a;" onclick="submitDriverDelivery()">تأكيد التسليم ونقل الطلب للمحاسبة</button>
            <button type="button" class="btn-cancel" onclick="closeDriverDeliverModal()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة إضافة طلب -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">📦 تثبيت طلب جديد</div>
            <input type="text" id="cName" placeholder="اسم الزبون (مطلوب)">
            <input type="tel" id="cPhone" placeholder="رقم الهاتف">
            <input type="text" id="cAddr" placeholder="العنوان بالتفصيل">
            <input type="number" id="cPrice" placeholder="سعر القطع فقط (دينار)" oninput="recalcNew()">
            
            <select id="cMethod" onchange="recalcNew()">
                <option value="داخل خانقين">داخل خانقين (+2,000 د.ع)</option>
                <option value="المحافظات">خارج خانقين / المحافظات (+5,000 د.ع)</option>
                <option value="بدون توصيل">بدون توصيل (0 د.ع)</option>
            </select>

            <div id="calcView" class="calc-preview">المجموع عند الزبون: 2,000 د.ع</div>
            <textarea id="cNotes" placeholder="ملاحظات الطلب (اختياري)"></textarea>

            <label class="upload-label" for="fileInput">📷 اختيار صور المنتجات</label>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event, 'new')">
            <div id="previewArea" class="previews"></div>

            <button type="button" class="btn-confirm" onclick="createOrder()">تثبيت الطلب</button>
            <button class="btn-cancel" onclick="closeAddModal()">إلغاء</button>
        </div>
    </div>

    <!-- نافذة تعديل الطلب -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✏️ تعديل الطلب</div>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="اسم الزبون">
            <input type="tel" id="editPhone" placeholder="رقم الهاتف">
            <input type="text" id="editAddr" placeholder="العنوان">
            <input type="number" id="editPrice" placeholder="سعر القطع">
            <select id="editMethod">
                <option value="داخل خانقين">داخل خانقين (+2,000 د.ع)</option>
                <option value="المحافظات">المحافظات (+5,000 د.ع)</option>
                <option value="بدون توصيل">بدون توصيل (0 د.ع)</option>
            </select>
            <textarea id="editNotes" placeholder="ملاحظات"></textarea>

            <div id="editPreviewArea" class="previews"></div>
            <label class="upload-label" for="editFileInput">📷 إضافة صور أخرى</label>
            <input type="file" id="editFileInput" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event, 'edit')">

            <button class="btn-confirm" style="background:#059669;" onclick="saveEditedOrder()">💾 حفظ التعديل</button>
            <button class="btn-cancel" onclick="closeEditModal()">إلغاء</button>
        </div>
    </div>

    <div id="modal" class="modal img-modal" onclick="this.style.display='none'">
        <img id="modalViewer" src="">
    </div>

    <script>
        const FIREBASE_URL = "https://orders-99674-default-rtdb.firebaseio.com/orders.json";
        const STORAGE_KEY = "orders_v7_delivery_system";

        let orders = [];
        let currentTab = "driver"; // driver, waitSettle, settled, archive
        let timeFilter = "today";
        let customDateVal = "";
        let activeImages = [];
        let editImages = [];

        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) orders = JSON.parse(raw);
        } catch(e) { orders = []; }

        function saveLocal() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
            } catch(e) {
                const light = orders.map(o => ({ ...o, images: [] }));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(light));
            }
        }

        function getFee(m) {
            if (!m) return 0;
            if (m.includes("خانقين")) return 2000;
            if (m.includes("المحافظات") || m.includes("شركة")) return 5000;
            return 0;
        }

        function recalcNew() {
            const p = parseFloat(document.getElementById("cPrice").value) || 0;
            const m = document.getElementById("cMethod").value;
            const f = getFee(m);
            document.getElementById("calcView").innerText = `المجموع عند الزبون: ${(p + f).toLocaleString()} د.ع (منها ${f.toLocaleString()} توصيل)`;
        }

        function getDateOnlyStr(timestamp) {
            const d = new Date(timestamp || Date.now());
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatTimeDisplay(timestamp) {
            const d = new Date(timestamp || Date.now());
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12 || 12;
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${hours}:${minutes} ${ampm} (${month}/${day})`;
        }

        function setTimeFilter(mode, btn) {
            timeFilter = mode;
            customDateVal = "";
            document.getElementById("customDatePicker").value = "";
            document.querySelectorAll(".btn-time").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            renderUI();
        }

        function onCustomDatePick(val) {
            if (!val) return;
            timeFilter = "custom";
            customDateVal = val;
            document.querySelectorAll(".btn-time").forEach(b => b.classList.remove("active"));
            renderUI();
        }

        function switchMainTab(tab) {
            currentTab = tab;
            document.querySelectorAll(".main-tab-btn").forEach(b => b.classList.remove("active"));
            if (tab === 'driver') document.getElementById("tabDriver").classList.add("active");
            if (tab === 'waitSettle') document.getElementById("tabWaitSettle").classList.add("active");
            if (tab === 'settled') document.getElementById("tabSettled").classList.add("active");
            if (tab === 'archive') document.getElementById("tabArchive").classList.add("active");
            renderUI();
        }

        function handleImageUpload(e, mode) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const r = new FileReader();
                r.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement("canvas");
                        let w = img.width, h = img.height;
                        const max = 220;
                        if (w > h && w > max) { h *= max / w; w = max; }
                        else if (h > max) { w *= max / h; h = max; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        const b64 = canvas.toDataURL("image/jpeg", 0.4);
                        if (mode === 'new') {
                            activeImages.push(b64);
                            renderThumbs('previewArea', activeImages, 'new');
                        } else {
                            editImages.push(b64);
                            renderThumbs('editPreviewArea', editImages, 'edit');
                        }
                    };
                    img.src = evt.target.result;
                };
                r.readAsDataURL(file);
            });
        }

        function renderThumbs(elemId, arr, mode) {
            const el = document.getElementById(elemId);
            el.innerHTML = "";
            arr.forEach((src, idx) => {
                el.innerHTML += `
                    <div class="thumb-wrap">
                        <img src="${src}">
                        <button type="button" class="thumb-del" onclick="delImg('${mode}', ${idx})">✕</button>
                    </div>
                `;
            });
        }

        function delImg(mode, idx) {
            if (mode === 'new') {
                activeImages.splice(idx, 1);
                renderThumbs('previewArea', activeImages, 'new');
            } else {
                editImages.splice(idx, 1);
                renderThumbs('editPreviewArea', editImages, 'edit');
            }
        }

        function isOrderInSelectedTime(o) {
            if (timeFilter === "all") return true;
            const t = o.timestamp || o.date || Date.now();
            const orderDay = getDateOnlyStr(t);
            const now = new Date();
            const todayStr = getDateOnlyStr(now.getTime());

            if (timeFilter === "today") return orderDay === todayStr;
            if (timeFilter === "yesterday") {
                const yest = new Date(now);
                yest.setDate(now.getDate() - 1);
                return orderDay === getDateOnlyStr(yest.getTime());
            }
            if (timeFilter === "custom") {
                return orderDay === customDateVal;
            }
            return true;
        }

        function updateCashBox(filteredOrders) {
            let totalCash = 0;
            let count = 0;

            filteredOrders.forEach(o => {
                if (o.status === "تمت المحاسبة") {
                    totalCash += (Number(o.price) || 0);
                    count++;
                }
            });

            document.getElementById("todayCash").innerText = totalCash.toLocaleString() + " د.ع";
            document.getElementById("todayDeliveredCount").innerText = `${count} طلبات مقبوضة`;
        }

        function renderUI() {
            const list = document.getElementById("ordersList");
            list.innerHTML = "";
            const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();

            orders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            let timeFilteredOrders = orders.filter(isOrderInSelectedTime);
            updateCashBox(timeFilteredOrders);

            // تصنيف الطلبات حسب الحالات الجديدة
            let driverOrders = timeFilteredOrders.filter(o => o.status === "بالطريق" || o.status === "قيد التجهيز");
            let waitSettleOrders = timeFilteredOrders.filter(o => o.status === "واصل - بانتظار التحاسب");
            let settledOrders = timeFilteredOrders.filter(o => o.status === "تمت المحاسبة");
            let archiveOrders = timeFilteredOrders.filter(o => o.status === "مؤجل" || o.status === "راجع");

            document.getElementById("driverCount").innerText = driverOrders.length;
            document.getElementById("waitSettleCount").innerText = waitSettleOrders.length;

            let targetList = [];
            if (currentTab === "driver") targetList = driverOrders;
            else if (currentTab === "waitSettle") targetList = waitSettleOrders;
            else if (currentTab === "settled") targetList = settledOrders;
            else if (currentTab === "archive") targetList = archiveOrders;

            if (query) {
                targetList = targetList.filter(o => 
                    (o.name || "").toLowerCase().includes(query) || 
                    (o.phone || "").toLowerCase().includes(query) ||
                    (o.addr || "").toLowerCase().includes(query)
                );
            }

            if (targetList.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#64748b; padding:30px; font-size:13px;">لا توجد طلبات في هذا القسم حالياً</p>`;
                return;
            }

            targetList.forEach(o => {
                let st = o.status || "قيد التجهيز";
                let cardClass = "";
                let badgeColor = "#38bdf8";

                if (st === "واصل - بانتظار التحاسب") { cardClass = "delivered-wait"; badgeColor = "#f59e0b"; }
                else if (st === "تمت المحاسبة") { cardClass = "settled"; badgeColor = "#34d399"; }
                else if (st === "مؤجل") { cardClass = "postponed"; badgeColor = "#d8b4fe"; }
                else if (st === "راجع") { cardClass = "returned"; badgeColor = "#f87171"; }

                let imgs = Array.isArray(o.images) ? o.images : (o.img ? [o.img] : []);
                let imgsHtml = "";
                if (imgs.length > 0) {
                    imgsHtml = `<div class="img-gallery">` +
                        imgs.map(src => `<img src="${src}" onclick="viewImg('${src}')">`).join("") +
                        `</div>`;
                }

                const price = Number(o.price) || 0;
                const fee = getFee(o.method);
                const total = o.total ? Number(o.total) : (price + fee);
                const timeText = formatTimeDisplay(o.timestamp);

                list.innerHTML += `
                    <div class="card ${cardClass}" id="card_${o.id}">
                        <div class="card-header">
                            <span class="cust-name">${o.name}</span>
                            <span class="order-time">🕒 ${timeText}</span>
                        </div>
                        <span class="badge-status" style="color:${badgeColor}; border:1px solid ${badgeColor};">الحالة: ${st}</span>
                        
                        <div class="card-details">
                            📍 العنوان: ${o.addr || 'غير محدد'}<br>
                            💵 سعر القطع: <strong>${price.toLocaleString()} د.ع</strong> | التوصيل: ${fee.toLocaleString()} د.ع<br>
                            💰 <span class="price-highlight">المطلوب قبضه: ${total.toLocaleString()} د.ع</span>
                        </div>
                        
                        ${o.driverNote ? `<div class="driver-note-box">🚚 <strong>ملاحظة المندوب:</strong> ${o.driverNote}</div>` : ''}
                        ${imgsHtml}
                        ${o.notes ? `<div style="background:#334155; padding:5px; border-radius:5px; font-size:11px; color:#fde047; margin-bottom:6px;">📝 ${o.notes}</div>` : ''}
                        
                        <div class="action-row">
                            ${o.phone ? `<a href="tel:${o.phone}" class="btn-call">📞 اتصال</a>` : ''}
                            <button class="btn-share" onclick="shareOrder('${o.id}')">📤 الوصل</button>
                            
                            <!-- أزرار العمليات حسب الحالة -->
                            ${(st === 'بالطريق' || st === 'قيد التجهيز') ? `
                                <button class="btn-driver-deliver" onclick="openDriverDeliverModal('${o.id}')">🚚 سلّمته للزبون</button>
                                <button class="btn-post" onclick="changeStatus('${o.id}', 'مؤجل')">⏳ تأجيل</button>
                                <button class="btn-ret" onclick="changeStatus('${o.id}', 'راجع')">❌ راجع</button>
                            ` : ''}

                            ${(st === 'واصل - بانتظار التحاسب') ? `
                                <button class="btn-settle-cash" onclick="confirmSettleCash('${o.id}')">💵 تم استلام الكاش بالمحل</button>
                            ` : ''}

                            <button class="btn-edit" onclick="openEditModal('${o.id}')">✏️ تعديل</button>
                        </div>
                    </div>
                `;
            });
        }

        // نافذة المندوب عند تسليم الطلب
        function openDriverDeliverModal(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            document.getElementById("deliverOrderId").value = o.id;
            const total = o.total ? Number(o.total) : ((Number(o.price) || 0) + getFee(o.method));
            document.getElementById("deliverOrderInfo").innerText = `الزبون: ${o.name} | المبلغ المطلوب: ${total.toLocaleString()} د.ع`;
            document.getElementById("deliverDriverNote").value = "";
            document.getElementById("driverDeliverModal").style.display = "flex";
        }

        function closeDriverDeliverModal() {
            document.getElementById("driverDeliverModal").style.display = "none";
        }

        function submitDriverDelivery() {
            const id = document.getElementById("deliverOrderId").value;
            const note = document.getElementById("deliverDriverNote").value.trim();

            orders = orders.map(item => {
                if (item.id === id) {
                    return {
                        ...item,
                        status: "واصل - بانتظار التحاسب",
                        driverNote: note || "تم التسليم بنجاح",
                        deliveredTime: Date.now()
                    };
                }
                return item;
            });

            saveLocal();
            closeDriverDeliverModal();
            renderUI();
            pushCloud();
        }

        // زر المحاسبة وتصفية الكاش عند وصول المندوب للمحل
        function confirmSettleCash(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;

            if (confirm(`هل تم استلام كاش طلب الزبون (${o.name}) من المندوب؟\nسيتم نقله لخانة "تمت المحاسبة" واحتساب مبلغه في الصندوق.`)) {
                orders = orders.map(item => {
                    if (item.id === id) {
                        return {
                            ...item,
                            status: "تمت المحاسبة",
                            settledTime: Date.now()
                        };
                    }
                    return item;
                });

                saveLocal();
                renderUI();
                pushCloud();
            }
        }

        function changeStatus(id, newStatus) {
            const o = orders.find(x => x.id === id);
            if (!o) return;

            if (confirm(`هل تريد تغيير حالة طلب (${o.name}) إلى "${newStatus}"؟`)) {
                orders = orders.map(item => {
                    if (item.id === id) {
                        return { ...item, status: newStatus };
                    }
                    return item;
                });

                saveLocal();
                renderUI();
                pushCloud();
            }
        }

        function createOrder() {
            const name = document.getElementById("cName").value.trim();
            const phone = document.getElementById("cPhone").value.trim();
            const addr = document.getElementById("cAddr").value.trim();
            const price = parseFloat(document.getElementById("cPrice").value) || 0;
            const method = document.getElementById("cMethod").value;
            const notes = document.getElementById("cNotes").value.trim();

            if (!name) { alert("اكتب اسم الزبون"); return; }

            const fee = getFee(method);
            const total = price + fee;
            const now = Date.now();

            const newOrder = {
                id: "id_" + now,
                name, phone, addr, price, fee, total, method, notes,
                timestamp: now,
                images: [...activeImages],
                status: "بالطريق" // يبدأ تلقائياً ليكون متاحاً للمندوب
            };

            orders.unshift(newOrder);
            saveLocal();
            renderUI();
            closeAddModal();

            document.getElementById("cName").value = "";
            document.getElementById("cPhone").value = "";
            document.getElementById("cAddr").value = "";
            document.getElementById("cPrice").value = "";
            document.getElementById("cNotes").value = "";
            document.getElementById("previewArea").innerHTML = "";
            activeImages = [];

            pushCloud();
        }

        function openEditModal(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            document.getElementById("editId").value = o.id;
            document.getElementById("editName").value = o.name || "";
            document.getElementById("editPhone").value = o.phone || "";
            document.getElementById("editAddr").value = o.addr || "";
            document.getElementById("editPrice").value = o.price || 0;
            document.getElementById("editMethod").value = o.method || "داخل خانقين";
            document.getElementById("editNotes").value = o.notes || "";

            editImages = Array.isArray(o.images) ? [...o.images] : (o.img ? [o.img] : []);
            renderThumbs('editPreviewArea', editImages, 'edit');
            document.getElementById("editModal").style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
            editImages = [];
        }

        function saveEditedOrder() {
            const id = document.getElementById("editId").value;
            const name = document.getElementById("editName").value.trim();
            const phone = document.getElementById("editPhone").value.trim();
            const addr = document.getElementById("editAddr").value.trim();
            const price = parseFloat(document.getElementById("editPrice").value) || 0;
            const method = document.getElementById("editMethod").value;
            const notes = document.getElementById("editNotes").value.trim();

            if (!name) { alert("اكتب اسم الزبون"); return; }

            const fee = getFee(method);
            const total = price + fee;

            orders = orders.map(o => {
                if (o.id === id) {
                    return { ...o, name, phone, addr, price, fee, total, method, notes, images: [...editImages] };
                }
                return o;
            });

            saveLocal();
            renderUI();
            closeEditModal();
            pushCloud();
        }

        function openAddModal() { document.getElementById("addModal").style.display = "flex"; }
        function closeAddModal() { document.getElementById("addModal").style.display = "none"; }

        function pushCloud() {
            document.getElementById("netStatus").innerText = "⏳ مزامنة...";
            fetch(FIREBASE_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orders)
            }).then(() => {
                document.getElementById("netStatus").innerText = "🟢 متزامن وسريع";
            }).catch(() => {
                document.getElementById("netStatus").innerText = "🟢 محفوظ بالتلفون";
            });
        }

        function fetchOrders() {
            document.getElementById("netStatus").innerText = "⏳ جلب البيانات...";
            fetch(FIREBASE_URL)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        let list = Array.isArray(data) ? data : Object.keys(data).map(k => ({ ...data[k], id: k }));
                        if (list.length > 0) {
                            orders = list;
                            saveLocal();
                            renderUI();
                        }
                    }
                    document.getElementById("netStatus").innerText = "🟢 متزامن وسريع";
                }).catch(() => {
                    document.getElementById("netStatus").innerText = "🟢 أوفلاين";
                });
        }

        function shareOrder(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;

            const fee = getFee(o.method);
            const total = o.total ? Number(o.total) : ((Number(o.price) || 0) + fee);

            let msg = `📦 *تفاصيل الطلب* \n` +
                      `━━━━━━━━━━━━━━\n` +
                      `👤 *الزبون:* ${o.name}\n` +
                      `📞 *الهاتف:* ${o.phone || 'غير مسجل'}\n` +
                      `📍 *العنوان:* ${o.addr || 'غير محدد'}\n` +
                      `💰 *المبلغ الصافي المطلوب:* ${total.toLocaleString()} دينار\n` +
                      `🚚 *نوع الشحنة:* ${o.method || 'داخل خانقين'}\n`;
            if (o.notes) msg += `📝 *ملاحظات:* ${o.notes}\n`;

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function viewImg(src) {
            document.getElementById("modalViewer").src = src;
            document.getElementById("modal").style.display = "flex";
        }

        recalcNew();
        renderUI();
        fetchOrders();
    </script>
</body>
</html>
