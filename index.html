<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات المباشرة</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; padding: 12px; color: #f8fafc; direction: rtl; }
        
        .sync-box { background: #1e293b; border: 1px solid #10b981; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .sync-text { font-size: 12px; font-weight: bold; color: #34d399; }
        .btn-sync { background: #0284c7; color: white; border: none; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-card { background: #1e293b; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .stat-card.full { grid-column: span 2; background: #0284c7; color: white; border: none; }
        .stat-num { font-size: 16px; font-weight: bold; margin-top: 4px; }
        .stat-label { font-size: 11px; opacity: 0.9; }

        .box { background: #1e293b; border-radius: 12px; padding: 14px; border: 1px solid #334155; margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #475569; border-radius: 8px; font-size: 14px; background: #0f172a; color: #fff; }
        textarea { resize: vertical; height: 50px; }
        
        .file-label { display: block; background: #334155; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px dashed #38bdf8; margin-bottom: 8px; color: #38bdf8; }
        .preview-list { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 4px; }
        .preview-thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #38bdf8; flex-shrink: 0; }

        .btn-main { background: #2563eb; color: #fff; border: 0; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        
        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
        .tab { background: #334155; color: #cbd5e1; border: 0; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; }
        .tab.active { background: #38bdf8; color: #0f172a; }

        .card { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .card.pending { border-right: 5px solid #f59e0b; }
        .card.shipping { border-right: 5px solid #38bdf8; }
        .card.done { border-right: 5px solid #10b981; }
        .card.returned { border-right: 5px solid #ef4444; }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .title { font-size: 15px; font-weight: bold; color: #fff; }
        .code { background: #334155; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .info { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 8px; }
        
        .card-images { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 4px; }
        .card-img { width: 85px; height: 85px; object-fit: cover; background: #0f172a; border-radius: 8px; border: 1px solid #475569; cursor: pointer; flex-shrink: 0; }

        .notes-box { background: #334155; border: 1px dashed #f59e0b; padding: 6px; border-radius: 6px; font-size: 12px; color: #fde047; margin-bottom: 8px; }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .b-khanaqin { background: #0369a1; color: #e0f2fe; }
        .b-comp { background: #854d0e; color: #fef3c7; }

        .btns { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
        .btn-act { border: 0; padding: 6px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .call { background: #22c55e; color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .share { background: #25d366; color: #fff; border: 0; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .del { background: #7f1d1d; color: #fca5a5; margin-right: auto; }

        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal img { max-width: 95%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="sync-box">
        <span class="sync-text" id="statusMsg">🟢 متصل بقاعدة البيانات السحابية</span>
        <button class="btn-sync" onclick="loadFromCloud()">🔄 تحديث الآن</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">المبالغ الواصلة</div>
            <div class="stat-num" style="color:#34d399;" id="statDelivered">0 د.ع</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">مبالغ في الطريق</div>
            <div class="stat-num" style="color:#38bdf8;" id="statShipping">0 د.ع</div>
        </div>
        <div class="stat-card full">
            <div class="stat-label">المجموع الكلي</div>
            <div class="stat-num" id="statTotal">0 د.ع</div>
        </div>
    </div>

    <div class="box">
        <h3 style="margin-bottom: 10px; font-size: 15px;">إضافة طلب جديد 📦</h3>
        <input type="text" id="custName" placeholder="اسم الزبون">
        <input type="tel" id="custPhone" placeholder="رقم الهاتف">
        <input type="text" id="itemCode" placeholder="رقم / كود القطعة">
        <input type="text" id="custAddr" placeholder="العنوان بالتفصيل">
        <input type="number" id="itemPrice" placeholder="المبلغ المطلوب (دينار)">
        <select id="shipMethod">
            <option value="داخل خانقين">توصيل: داخل خانقين</option>
            <option value="شركة التوصيل">توصيل: شركة التوصيل (المحافظات)</option>
        </select>
        <textarea id="custNotes" placeholder="ملاحظات إضافية (اختياري)"></textarea>

        <!-- اختيار عدة صور دفعة واحدة -->
        <label class="file-label" for="itemImages">📷 اضغط هنا لاختيار صورة أو عدة صور سكرين</label>
        <input type="file" id="itemImages" accept="image/*" multiple style="display:none;" onchange="handleMultipleImages(event)">
        <div id="previewContainer" class="preview-list"></div>

        <button type="button" class="btn-main" onclick="saveNewOrder()">تثبيت الطلب</button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('all', this)">الكل (<span id="countTotal">0</span>)</button>
        <button class="tab" onclick="switchTab('داخل خانقين', this)">خانقين</button>
        <button class="tab" onclick="switchTab('شركة التوصيل', this)">المحافظات</button>
        <button class="tab" onclick="switchTab('بالطريق', this)">🚚 بالطريق</button>
        <button class="tab" onclick="switchTab('تم التسليم', this)">✅ واصل</button>
        <button class="tab" onclick="switchTab('راجع', this)">❌ راجع</button>
    </div>

    <div id="ordersContainer"></div>

    <div id="imgModal" class="modal" onclick="closeModal()">
        <img id="modalImg" src="">
    </div>

    <script>
        const FIREBASE_ENDPOINT = "https://orders-99674-default-rtdb.firebaseio.com/orders.json";

        let allOrders = {};
        let activeTab = 'all';
        let currentUploadedImages = [];

        // معالجة وضغط عدة صور معاً
        function handleMultipleImages(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 600;
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.6);
                        
                        currentUploadedImages.push(base64);
                        renderPreviews();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPreviews() {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            currentUploadedImages.forEach(src => {
                container.innerHTML += `<img src="${src}" class="preview-thumb">`;
            });
        }

        function updateTotals(ordersList) {
            let done = 0, road = 0, total = 0;
            ordersList.forEach(o => {
                const val = Number(o.price) || 0;
                if (o.status === 'تم التسليم') done += val;
                if (o.status === 'بالطريق' || o.status === 'قيد التجهيز') road += val;
                if (o.status !== 'راجع') total += val;
            });
            document.getElementById('statDelivered').innerText = done.toLocaleString() + ' د.ع';
            document.getElementById('statShipping').innerText = road.toLocaleString() + ' د.ع';
            document.getElementById('statTotal').innerText = total.toLocaleString() + ' د.ع';
        }

        function drawList() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            const ordersList = Object.keys(allOrders).map(key => ({ ...allOrders[key], firebaseId: key }));
            document.getElementById('countTotal').innerText = ordersList.length;

            let filtered = ordersList.filter(o => {
                if (activeTab === 'all') return true;
                if (activeTab === 'داخل خانقين') return o.by && o.by.includes('خانقين');
                if (activeTab === 'شركة التوصيل') return o.by && o.by.includes('شركة');
                return o.status === activeTab;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">لا توجد طلبات مسجلة</p>';
                updateTotals(ordersList);
                return;
            }

            filtered.reverse().forEach(o => {
                let cls = 'pending';
                if (o.status === 'بالطريق') cls = 'shipping';
                if (o.status === 'تم التسليم') cls = 'done';
                if (o.status === 'راجع') cls = 'returned';

                let bCls = (o.by && o.by.includes('خانقين')) ? 'b-khanaqin' : 'b-comp';

                // دعم الصور المتعددة أو المفردة السابقة
                let imgs = [];
                if (Array.isArray(o.images)) imgs = o.images;
                else if (o.img) imgs = [o.img];

                let imagesHtml = '';
                if (imgs.length > 0) {
                    imagesHtml = `<div class="card-images">` + 
                        imgs.map(imgSrc => `<img src="${imgSrc}" class="card-img" onclick="openModal('${imgSrc}')">`).join('') +
                        `</div>`;
                }

                container.innerHTML += `
                    <div class="card ${cls}">
                        <div class="card-top">
                            <span class="title">${o.name}</span>
                            <span class="code">كود: ${o.code}</span>
                        </div>
                        <div class="info">
                            📍 ${o.addr || 'بدون عنوان'}<br>
                            💰 ${Number(o.price).toLocaleString()} دينار | 
                            <span class="badge ${bCls}">${o.by}</span> | 
                            <strong>${o.status}</strong>
                        </div>
                        ${imagesHtml}
                        ${o.notes ? `<div class="notes-box">📝 ${o.notes}</div>` : ''}
                        <div class="btns">
                            ${o.phone ? `<a href="tel:${o.phone}" class="call">📞 اتصال</a>` : ''}
                            <button class="share" onclick="shareWithWhatsApp('${o.firebaseId}')">📤 مشاركة الوصل والصور</button>
                            <button class="btn-act" style="background:#0284c7; color:#fff;" onclick="changeStatus('${o.firebaseId}', 'بالطريق')">بالطريق</button>
                            <button class="btn-act" style="background:#059669; color:#fff;" onclick="changeStatus('${o.firebaseId}', 'تم التسليم')">واصل</button>
                            <button class="btn-act" style="background:#dc2626; color:#fff;" onclick="changeStatus('${o.firebaseId}', 'راجع')">راجع</button>
                            <button class="btn-act del" onclick="removeOrder('${o.firebaseId}')">حذف</button>
                        </div>
                    </div>
                `;
            });

            updateTotals(ordersList);
        }

        async function loadFromCloud() {
            try {
                const res = await fetch(FIREBASE_ENDPOINT);
                if (res.ok) {
                    const data = await res.json();
                    allOrders = data || {};
                    drawList();
                    document.getElementById('statusMsg').innerText = '🟢 البيانات متزامنة فورياً';
                }
            } catch(e) {
                document.getElementById('statusMsg').innerText = '⚠️ تعذر الاتصال بالسيرفر';
            }
        }

        async function saveNewOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const code = document.getElementById('itemCode').value.trim();
            const addr = document.getElementById('custAddr').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            const by = document.getElementById('shipMethod').value;
            const notes = document.getElementById('custNotes').value.trim();

            if (!name || !code) {
                alert('يرجى كتابة اسم الزبون وكود القطعة');
                return;
            }

            const item = { 
                name, phone, code, addr, price, by, notes, 
                images: currentUploadedImages,
                status: 'قيد التجهيز', 
                date: Date.now() 
            };

            document.getElementById('statusMsg').innerText = '⏳ جاري الحفظ في السحابة...';

            try {
                await fetch(FIREBASE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
                
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('itemCode').value = '';
                document.getElementById('custAddr').value = '';
                document.getElementById('itemPrice').value = '';
                document.getElementById('custNotes').value = '';
                document.getElementById('itemImages').value = '';
                document.getElementById('previewContainer').innerHTML = '';
                currentUploadedImages = [];
                
                loadFromCloud();
            } catch(e) {
                alert('حدث خطأ في الاتصال');
            }
        }

        async function changeStatus(id, newStatus) {
            const updateUrl = FIREBASE_ENDPOINT.replace('.json', `/${id}.json`);
            await fetch(updateUrl, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            loadFromCloud();
        }

        async function removeOrder(id) {
            if (confirm('هل تريد حذف هذا الطلب نهائياً؟')) {
                const deleteUrl = FIREBASE_ENDPOINT.replace('.json', `/${id}.json`);
                await fetch(deleteUrl, { method: 'DELETE' });
                loadFromCloud();
            }
        }

        function switchTab(tab, el) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            drawList();
        }

        // تحويل base64 إلى ملف حقيقي للمشاركة المباشرة
        function dataURLtoFile(dataurl, filename) {
            let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new File([u8arr], filename, {type:mime});
        }

        async function shareWithWhatsApp(id) {
            const o = allOrders[id];
            if (!o) return;
            
            let textMsg = `📄 *وصل تفاصيل الطلب* 📦\n` +
                          `━━━━━━━━━━━━━━\n` +
                          `👤 *الاسم:* ${o.name}\n` +
                          `📞 *الهاتف:* ${o.phone || 'غير مسجل'}\n` +
                          `🏷️ *كود القطعة:* ${o.code}\n` +
                          `📍 *العنوان:* ${o.addr || 'غير محدد'}\n` +
                          `💰 *المبلغ الصافي:* ${Number(o.price).toLocaleString()} دينار\n` +
                          `🚚 *طريقة التوصيل:* ${o.by}\n`;
            if (o.notes) textMsg += `📝 *ملاحظات:* ${o.notes}\n`;

            let imgs = [];
            if (Array.isArray(o.images)) imgs = o.images;
            else if (o.img) imgs = [o.img];

            // إذا كان المتصفح يدعم مشاركة الملفات (Web Share API) سيفتح قائمة التطبيقات لاختيار واتساب مع الصور والنص معاً
            if (navigator.canShare && imgs.length > 0) {
                try {
                    const filesArray = imgs.map((base64, index) => dataURLtoFile(base64, `item_${index+1}.jpg`));
                    if (navigator.canShare({ files: filesArray })) {
                        await navigator.share({
                            files: filesArray,
                            title: 'وصل طلب',
                            text: textMsg
                        });
                        return;
                    }
                } catch (error) {
                    console.log('Share fallback to URL');
                }
            }

            // خيار بديل قياسي لواتساب في حال عدم دعم المتصفح لنقل الملفات
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textMsg)}`, '_blank');
        }

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = 'none';
        }

        loadFromCloud();
        setInterval(loadFromCloud, 4000);
    </script>
</body>
</html>
