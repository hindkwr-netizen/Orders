<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة اللايف</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 إضافة طلب جديد</h2>
    
    <div class="input-group">
        <label>اسم الزبون</label>
        <input type="text" id="customerName" placeholder="مثال: أحمد محمد">
    </div>

    <div class="input-group">
        <label>الأغراض (مثال: خلاط، عطر، إلخ)</label>
        <input type="text" id="items" placeholder="شنو طلب؟">
    </div>

    <div class="input-group">
        <label>السعر الكلي (دينار)</label>
        <input type="number" id="price" placeholder="مثال: 25000">
    </div>

    <div class="input-group">
        <label>حالة الطلب</label>
        <select id="status">
            <option value="قيد التجميع">⏳ قيد التجميع</option>
            <option value="جاهز للشحن">📦 جاهز للشحن</option>
            <option value="واصل">✅ واصل</option>
        </select>
    </div>

    <div class="input-group">
        <label>صورة الأغراض</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button class="btn-add">حفظ الطلب</button>
</div>

</body>
</html>
